<!DOCTYPE html>
<html lang="ru">
  <head>
    <title>Animations</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

  <body>
    <div class="content">
      <div class="buttons">
        <h2 class="buttons__title">Buttons</h2>

        <div class="buttons__item">
          <h3 class="buttons__item-description">Primary/Primary</h3>
          <button class="buttons__button">Normal</button>
        </div>

        <div class="buttons__item buttons__item--secondary">
          <h3 class="buttons__item-description">Primary/Secondary</h3>
          <button class="buttons__button buttons__button--color">Normal</button>
        </div>

        <div class="buttons__item buttons__item--simple">
          <h3
            class="buttons__item-description buttons__item-description--no-margin"
          >
            Simple Buttons
          </h3>

          <button class="buttons__button_simple">
            Normal
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M3.75 12H20.25"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M13.5 5.25L20.25 12L13.5 18.75"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <button class="buttons__button_simple">
            Normal
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M3.75 12H20.25"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M13.5 5.25L20.25 12L13.5 18.75"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="form">
        <h2 class="form__title">Form elements</h2>

        <div class="form__input-field">
          <label class="form__label" for="inputField">Input Field</label>
          <input
            class="form__input"
            type="text"
            name="Input_Field"
            id="inputField"
            placeholder="Normal"
          />
        </div>

        <div class="form__dropdown-list">
          <h3 class="form__description">Dropdown Item</h3>

          <div class="form__dropdown-item">
            <p class="form__dropdown-description">Default Item</p>
            <ul class="form__select">
              <li class="form__option">
                <button class="form__button">Normal</button>
              </li>
              <li class="form__option">
                <button class="form__button">Hover</button>
              </li>
              <li class="form__option">
                <button disabled class="form__button">Disable</button>
              </li>
            </ul>
          </div>
